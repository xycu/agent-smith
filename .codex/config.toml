# Project permissions. Loaded when this repository is trusted.
# AGENTS.md governs which Git/GitHub actions a task authorizes.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "agent-smith"

[permissions.agent-smith]
extends = ":workspace"

[permissions.agent-smith.network]
# GitHub API, Git remotes, and documentation access.
enabled = true
