name: Bug report
description: Report a bug with reproduction steps and observed behavior.
body:
  - type: markdown
    attributes:
      value: |
        Report suspected vulnerabilities through the private process in the security policy. Redact credentials, private code, personal data and sensitive prompts from public evidence. [Security policy](https://github.com/xycu/agent-smith/blob/main/SECURITY.md)
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the plugin version or commit, host and version, operating system, Node.js version and affected chain or step. Use unknown for versions you cannot determine and not applicable for a chain or step when appropriate.
      placeholder: |
        Plugin version or commit
        Host and version
        Operating system
        Node.js version
        Chain or step
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Describe how to reproduce the bug. Use a disposable repository and synthetic data where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what happened, including any error message.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Sanitized configuration
      description: Optionally include relevant policy overrides, hooks or permission settings with secrets and private content removed.
      render: json
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optionally include relevant output with credentials, private code, personal data and sensitive prompts removed.
      render: text
    validations:
      required: false
