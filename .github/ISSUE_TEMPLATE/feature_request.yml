name: Feature request
description: Describe a problem and the outcome you want.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting a request. Keep credentials, private code, personal data and sensitive prompts out of public submissions. Report suspected vulnerabilities through the private security process. [Security policy](https://github.com/xycu/agent-smith/blob/main/SECURITY.md)
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: Describe what you would like to achieve.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Additional use-case detail
      description: Optionally describe a situation that helps explain the request.
    validations:
      required: false
