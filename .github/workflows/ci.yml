name: CI

# Runs the test suite and the two guards on every pull request and on pushes to main.
# Every push to main ends with a CI result: only superseded pull request runs are cancelled, and each
# push to main has its own concurrency group. release.yml starts from the result of this run.
# The repository squash-merges, so the pull request title is the commit on main: pr-title.yml lints
# it. The `commits` job lints the branch commits as hygiene, because they only appear in the squash body.
# Runner: the TrueNAS self-hosted runner (ADR-020), except for a pull request from a fork, which
# falls back to a GitHub-hosted runner. The repository is public. The fallback only covers an honest
# fork PR, because a fork PR runs the workflow file of its own branch and its author can edit
# `runs-on`. The boundary is the repository setting "Require approval for all external contributors".
# The first step of `test` refuses uid 0, because ADR-020 D4 requires a non-root runner user.
# Each job stops after 15 minutes (a normal suite run takes about 3.5).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and version check
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","truenas"]') }}
    timeout-minutes: 15
    steps:
      - name: Refuse to run as root (ADR-020)
        run: test "$(id -u)" -ne 0 || { echo "::error::the runner runs this job as uid 0; ADR-020 requires a non-root service user"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      # Required contract tool, approved CI-only npm exception. Upgrade the pin in a deliberate
      # commit after all five real contract fixtures pass. Git and OpenSpec failures fail CI.
      # Expected Linux skips by identity and condition (counts alone cannot identify a regression).
      # - live: a branch with no pull request is skipped — GH_LIVE != 1.
      # - live: the real comment projection is one parseable object per line across pages — GH_LIVE != 1.
      # - CLAUDE.md has no @ imports — CLAUDE.md is absent.
      # - real gh without a login is not authenticated — gh is absent from PATH.
      # Three default skips with gh available, four with gh absent; a present CLAUDE.md reduces either by one.
      # Both permission checks in no-recursive-delete.test.mjs run on the non-root Linux runner.
      - name: Install OpenSpec contract CLI
        shell: bash
        env:
          OPENSPEC_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
        run: |
          git --version
          prefix="$(mktemp -d "$RUNNER_TEMP/openspec.XXXXXX")"
          export npm_config_cache="$prefix/npm-cache"
          export npm_config_userconfig="$prefix/npmrc"
          npm install --prefix "$prefix" --no-save --package-lock=false @fission-ai/openspec@1.16.1
          openspec="$prefix/node_modules/.bin/openspec"
          version="$("$openspec" --version)"
          test "$version" = "1.16.1" || { echo "::error::expected OpenSpec 1.16.1, got $version"; exit 1; }
          echo "OpenSpec $version"
          echo "OPENSPEC_BIN=$openspec" >> "$GITHUB_ENV"
      - name: Test suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: node --test skills/10x-pipeline/test/*.test.mjs skills/openspec-pipeline/test/*.test.mjs tools/test/*.test.mjs
      - name: Check version fields are in lockstep
        run: node tools/version-check.mjs

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","truenas"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Lint commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/commit-lint.mjs "$BASE..$HEAD"
